<script>
// Light/dark theme toggle for the navbar. Defaults to the OS preference
// (set in <head>); the user's explicit choice is remembered in localStorage.
(function () {
  var STORAGE_KEY = 'ohmeow-theme';

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function paintToggle(theme) {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var icon = btn.querySelector('i');
    if (icon) icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }

  function syncUtterances(theme) {
    var frame = document.querySelector('iframe.utterances-frame');
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage(
      { type: 'set-theme', theme: theme === 'dark' ? 'github-dark' : 'github-light' },
      'https://utteranc.es'
    );
  }

  function applyTheme(theme, persist) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-bs-theme', theme);
    if (persist) {
      try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
    }
    paintToggle(theme);
    syncUtterances(theme);
  }

  // Follow OS changes until the user picks a theme explicitly.
  try {
    if (!localStorage.getItem(STORAGE_KEY)) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        applyTheme(e.matches ? 'dark' : 'light', false);
      });
    }
  } catch (e) {}

  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.querySelector('.navbar .navbar-nav.ms-auto');
    if (nav && !document.getElementById('theme-toggle')) {
      var li = document.createElement('li');
      li.className = 'nav-item compact';
      var btn = document.createElement('button');
      btn.id = 'theme-toggle';
      btn.className = 'theme-toggle nav-link';
      btn.type = 'button';
      btn.innerHTML = '<i class="bi bi-moon-fill" role="img" aria-hidden="true"></i>';
      btn.addEventListener('click', function () {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
      });
      li.appendChild(btn);
      nav.appendChild(li);
    }
    paintToggle(currentTheme());
    // Utterances loads its iframe lazily; sync its theme once it appears.
    var tries = 0;
    var timer = setInterval(function () {
      if (document.querySelector('iframe.utterances-frame') || ++tries > 20) {
        syncUtterances(currentTheme());
        clearInterval(timer);
      }
    }, 500);
  });
})();
</script>
