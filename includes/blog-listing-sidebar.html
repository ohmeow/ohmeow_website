<script>
// Blog listing: treat the categories sidebar as part of the content column
// by moving it inside the listing grid (next to the posts) instead of
// leaving it in the page margin.
(function () {
  var sidebar = document.querySelector('#quarto-content > .sidebar.margin-sidebar');
  var listing = document.querySelector('.quarto-listing');
  if (sidebar && listing && !listing.contains(sidebar)) {
    listing.appendChild(sidebar);
    document.body.classList.add('has-listing-sidebar');
  }
})();
</script>
