project:
  type: website

website:
  title: ohmeow
  image: images/ohmeow_logo.png
  favicon: images/ohmeow_favicon.png
  site-url: "https://ohmeow.com"
  description: "ohmeow builds full-stack AI products: eval-first LLM pipelines, robust APIs, and polished front-ends, backed by 25+ years of shipping software."
  twitter-card: true
  open-graph: true
  comments:
    utterances:
      repo: ohmeow/ohmeow_website
  navbar:
    logo:
      light: images/ohmeow_logo.png
      dark: images/ohmeow_logo_dark.png
    logo-alt: ohmeow.com
    pinned: true
    collapse-below: lg
    left:
      - text: Services
        href: index.qmd#services
      - text: Work
        href: index.qmd#clients
      - text: Blog
        href: blog.qmd
      - text: Guides
        menu:
          - text: "All Guides"
            icon: journal-bookmark
            href: guides.md
          - text: "Vue 3"
            icon: file-earmark-code
            href: pages/guides/vue3-guide.md
          - text: "FastAPI"
            icon: lightning-charge
            href: pages/guides/fastapi-guide.md
          - text: "PostgreSQL"
            icon: database
            href: pages/guides/postgresql-guide.md
          - text: "Deployment"
            icon: box-seam
            href: pages/guides/deployment-guide.md
      - text: More
        menu:
          - text: "blurr (open source)"
            icon: layers
            href: https://ohmeow.github.io/blurr/
            target: blank
          - text: "fastai x Hugging Face Study Group"
            icon: youtube
            href: https://www.youtube.com/playlist?list=PLD80i8An1OEF8UOb9N9uSoidOGIMKW96t
            target: blank
          - text: "About me"
            icon: person
            href: index.qmd#about

    right:
      - icon: twitter-x
        href: https://x.com/waydegilliam
        target: blank
        aria-label: X (Twitter)
      - icon: github
        href: https://github.com/ohmeow
        target: blank
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/waydegilliam
        target: blank
        aria-label: LinkedIn
      - icon: rss
        href: index.xml
        aria-label: RSS feed

format:
  html:
    theme:
      - cosmo
      - custom.scss
    grid:
      sidebar-width: 280px
      body-width: 2400px
      margin-width: 280px
      gutter-width: 1.5rem
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/?(www)\.ohmeow\.com\/**'
    include-in-header:
      - includes/theme-head.html
    include-after-body:
      - includes/footer.html
      - includes/site.html
